version: "3.9"

services:
  translator:
    build:
      context: .
      dockerfile: Dockerfile
    image: multilingual-translator:dev
    container_name: translator_dev
    ports:
      - "7860:7860"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_USERNAME=${HF_USERNAME:-}
      - MODEL_CACHE_DIR=/tmp/models
      - PORT=7860
      - LOG_LEVEL=debug
    volumes:
      # Hot-reload source without rebuilding the image
      - ./app.py:/app/app.py:ro
      - ./model_loader.py:/app/model_loader.py:ro
      - ./static:/app/static:ro
      # Persist model cache between restarts
      - model_cache:/tmp/models
    command:
      [
        "uvicorn", "app:app",
        "--host", "0.0.0.0",
        "--port", "7860",
        "--reload",
        "--reload-dir", "/app",
        "--log-level", "debug"
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  model_cache:
    driver: local
